<!doctype html><html lang="zh-CN"><head><title>「不怕吃灰」收藏夹</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{width:300px;margin:0;padding:16px;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#292524}h1{font-size:16px;margin:0 0 12px}label{display:block;margin:10px 0 4px;color:#57534e}input{box-sizing:border-box;width:100%;padding:8px;border:1px solid #d6d3d1;border-radius:7px}button{width:100%;margin-top:14px;padding:10px;border:0;border-radius:7px;background:#1f3a32;color:#fff;cursor:pointer}button.secondary{margin-top:8px;background:#eee7df;color:#332b26}button.tertiary{margin-top:8px;background:#dfe9e2;color:#1f3a32}p{line-height:1.5;color:#57534e}.status{margin-top:10px;font-size:12px}.count{margin:10px 0;padding:8px;border-radius:7px;background:#eff6f1;color:#1f3a32;font-size:12px}</style></head><body><h1>「不怕吃灰」收藏夹</h1><p>打开各平台收藏页后，点击一次即可自动滚动、翻页、去重、导入并完成 AI 分类。</p><label>本地服务地址</label><input id="endpoint" value="http://127.0.0.1:8787"><label>配对码</label><input id="token" placeholder="在本地网页中生成"><div class="count" id="count">正在连接页面采集器…</div><button id="syncAll" class="tertiary">跨平台一键同步</button><button id="sync">一键同步当前平台</button><button class="secondary" id="reset">重新开始本次采集</button><div class="status" id="status"></div><script src="popup.js"></script></body></html>
